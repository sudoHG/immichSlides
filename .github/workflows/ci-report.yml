name: ci-report

on:
  workflow_run:
    workflows: [ci-nightly, ci-gate, ci-ui]
    types: [completed]
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    concurrency:
      group: ci-report-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: /usr/bin/python3 scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/ci-python"
      - env:
          CI_REPORT_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/ci-python/bin/python3" -B scripts/ci_report.py'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-report/daily
          if-no-files-found: error
          retention-days: 90
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-pr-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-report/pull-requests
          if-no-files-found: ignore
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-report-runs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-report/runs
          if-no-files-found: ignore
          retention-days: 7
