name: ci-nightly

on:
  schedule:
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: Optional single shard for diagnosis; cannot establish a complete nightly
        required: false
        default: ''
        type: string
      live_only:
        description: Diagnose live boundaries only; cannot establish a complete nightly
        required: false
        default: false
        type: boolean
      ui_only:
        description: Diagnose complete fixture UI without strict or live jobs; cannot establish a complete nightly
        required: false
        default: false
        type: boolean
      strict_only:
        description: Diagnose strict shards without live jobs or test-server traffic
        required: false
        default: false
        type: boolean
      probe_environment_refusal:
        description: Credential-free negative probe of the main-only live environment
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/ci-nightly.yml
      - scripts/ci_nightly.py
      - scripts/ci_nightly_change.py
      - scripts/ci_nightly_ui.py
      - scripts/ci_ui_tests.py
      - scripts/ci-ui-shards.json
      - scripts/nightly-*.json
      - scripts/run_strict_ci_tracer.py
      - scripts/ci_live_tests.py
      - scripts/ci_build_archive.py
      - scripts/ci_unit_tests.py
      - scripts/ci_review_packages.py
      - scripts/p2-review.html

permissions:
  contents: read

concurrency:
  group: ci-nightly-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  change:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      run_nightly: ${{ steps.decision.outputs.run_nightly }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private configuration and set up pinned reader packages
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
          /usr/bin/python3 -B scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/nightly-python"
      - name: Compare this commit with the last successful scheduled nightly
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_nightly_change.py \
            --output-dir "$RUNNER_TEMP/nightly-change"
      - name: Publish the change decision
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-change-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-change/nightly-change.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Display the decision
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nightly-change/nightly-change.md"; then
            cat "$RUNNER_TEMP/nightly-change/nightly-change.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$RUNNER_TEMP/nightly-change"

  plan:
    if: ${{ !cancelled() && !inputs.probe_environment_refusal && needs.change.outputs.run_nightly != 'false' }}
    needs: change
    runs-on: xcode-27
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      ui_matrix: ${{ steps.ui_matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject private configuration before setup
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
      - name: Select and verify pinned toolchain
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 \
            --venv "$RUNNER_TEMP/nightly-python" --verify-toolchain
      - name: Validate the full versioned matrix and record this attempt
        id: matrix
        env:
          NIGHTLY_DIAGNOSTIC_SHARD: ${{ inputs.shard }}
        run: |
          matrix=$("$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_nightly.py plan \
            --output-dir "$RUNNER_TEMP/nightly-plan" --only-shard "$NIGHTLY_DIAGNOSTIC_SHARD" \
            ${{ inputs.ui_only && '--diagnostic-tier ui' || inputs.strict_only && '--diagnostic-tier strict' || '' }})
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Plan the complete default-plan UI population on every device
        id: ui_matrix
        run: |
          matrix=$("$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_nightly_ui.py plan \
            --output-dir "$RUNNER_TEMP/nightly-ui-plan")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
      - name: Publish the UI scheduling record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-ui-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-plan/plan.json
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error
      - name: Publish the scheduling record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-plan/plan.json
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error

  strict:
    if: github.event_name != 'pull_request' && !inputs.live_only && !inputs.ui_only && !inputs.probe_environment_refusal
    needs: plan
    name: nightly-strict-${{ matrix.id }}
    runs-on: xcode-27
    timeout-minutes: 165
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject private configuration before setup
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
      - name: Select and verify pinned toolchain
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 \
            --venv "$RUNNER_TEMP/nightly-python" --verify-toolchain
      - name: Create a dedicated simulator for this shard
        env:
          NIGHTLY_DEVICE: ${{ matrix.device }}
          NIGHTLY_PLATFORM: ${{ matrix.platform }}
        run: |
          device=$(/usr/bin/python3 -c 'import json,os; p=json.load(open("scripts/ci-pins.json")); d=os.environ["NIGHTLY_DEVICE"]; print(p["device_types"]["appletv" if d=="tv" else d])')
          runtime=$(/usr/bin/python3 -c 'import json,os; print(json.load(open("scripts/ci-pins.json"))["simulators"][os.environ["NIGHTLY_PLATFORM"]]["runtime"])')
          udid=$(xcrun simctl create immichSlides-nightly "$device" "$runtime")
          echo "NIGHTLY_SIMULATOR=$udid" >> "$GITHUB_ENV"
          os_name=$([ "$NIGHTLY_PLATFORM" = ios ] && echo iOS || echo tvOS)
          echo "NIGHTLY_DESTINATION=platform=$os_name Simulator,id=$udid" >> "$GITHUB_ENV"
      - name: Boot the dedicated simulator before bounded case resets
        timeout-minutes: 11
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B - <<'PY'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from strict_e2e_runner_support import boot_simulator
          def report(line):
              print(line, flush=True)
              with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                  summary.write(line + "\n")
          boot_simulator(os.environ["NIGHTLY_SIMULATOR"], report=report)
          PY
      - name: Warm the shard once and execute every scheduled case
        env:
          NIGHTLY_SHARD: ${{ matrix.id }}
          NIGHTLY_PLATFORM: ${{ matrix.platform }}
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/run_strict_ci_tracer.py \
            --manifest scripts/nightly-matrix.json --shard "$NIGHTLY_SHARD" \
            --platform "$NIGHTLY_PLATFORM" --destination "$NIGHTLY_DESTINATION" \
            --output-dir "$RUNNER_TEMP/nightly-strict" --min-free-gib 30 \
            --cold-timeout-seconds 1200 --warm-timeout-seconds 600
      - name: Export scanned public fixture review packages
        id: review
        if: always()
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_review_packages.py export-shard \
            --input-dir "$RUNNER_TEMP/nightly-strict" --output-dir "$RUNNER_TEMP/p2-review-packages"
          echo 'safe=true' >> "$GITHUB_OUTPUT"
      - name: Publish compact records and package hash bindings even after failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-strict-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-strict/records
          retention-days: 7
          if-no-files-found: error
      - name: Publish P2 packages for maintainer review
        if: always() && steps.review.outputs.safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2-review-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/p2-review-packages
          retention-days: 7
          if-no-files-found: error
      - name: Display records and clean task outputs
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nightly-strict/records/summary.md"; then
            cat "$RUNNER_TEMP/nightly-strict/records/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/nightly-strict/runner-group-cleanup-failed"; then
            echo 'Runner descendants could not be stopped; retaining inputs until runner teardown.' >&2
            exit 1
          fi
          if test -n "$NIGHTLY_SIMULATOR"; then
            xcrun simctl shutdown "$NIGHTLY_SIMULATOR" || true
            xcrun simctl delete "$NIGHTLY_SIMULATOR"
          fi
          rm -rf "$RUNNER_TEMP/nightly-strict"
          rm -rf "$RUNNER_TEMP/p2-review-packages"

  aggregate:
    if: ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && github.event_name != 'pull_request' && !inputs.live_only && !inputs.probe_environment_refusal }}
    needs: [change, plan, strict, ui-aggregate]
    name: nightly-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject private configuration before setup
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
      - name: Set up pinned reader packages
        run: |
          /usr/bin/python3 -B scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/nightly-python"
      - name: Download this attempt's scheduling record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-plan
      - name: Download this attempt's shard records
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: nightly-strict-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-records
      - name: Download this attempt's UI aggregate
        if: always() && !inputs.strict_only && !inputs.shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-ui-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-aggregate
      - name: Validate provenance, matrix equality and the fixed nightly aggregate
        if: always()
        env:
          NIGHTLY_MATRIX_JOB_RESULT: ${{ needs.strict.result }}
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_nightly.py aggregate \
            --plan "$RUNNER_TEMP/nightly-plan/plan.json" --records-dir "$RUNNER_TEMP/nightly-records" \
            --output-dir "$RUNNER_TEMP/nightly-aggregate" --matrix-job-result "$NIGHTLY_MATRIX_JOB_RESULT" \
            --ui-record "$RUNNER_TEMP/nightly-ui-aggregate/nightly-ui.json"
      - name: Publish the aggregate and non-eligible rollup entry
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-aggregate
          retention-days: 7
          if-no-files-found: error
      - name: Display aggregate and clean downloads
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nightly-aggregate/nightly.md"; then
            cat "$RUNNER_TEMP/nightly-aggregate/nightly.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$RUNNER_TEMP/nightly-plan" "$RUNNER_TEMP/nightly-records" "$RUNNER_TEMP/nightly-aggregate" "$RUNNER_TEMP/nightly-ui-aggregate"


  ui-archive:
    needs: [change, live-build]
    if: ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && github.event_name != 'pull_request' && !inputs.live_only && !inputs.strict_only && !inputs.shard && !inputs.probe_environment_refusal && needs.live-build.result == 'success' }}
    name: ui-archive
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      app_affected: ${{ steps.select.outputs.app_affected }}
      run_ui: ${{ steps.select.outputs.run_ui }}
      ios_artifact_id: ${{ steps.select.outputs.ios_artifact_id }}
      ios_producer_run_id: ${{ steps.select.outputs.ios_producer_run_id }}
      tvos_artifact_id: ${{ steps.select.outputs.tvos_artifact_id }}
      tvos_producer_run_id: ${{ steps.select.outputs.tvos_producer_run_id }}
      selection_artifact: ${{ steps.select.outputs.selection_artifact }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create the pinned Linux reader environment
        run: |
          python3 -B scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/ui-python"
          echo "PYTHON=$RUNNER_TEMP/ui-python/bin/python3" >> "$GITHUB_ENV"
      - name: Verify both current-attempt nightly archives
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$PYTHON" -B scripts/ci_ui_tests.py wait-archive \
            --output-dir "$RUNNER_TEMP/ui-selection" --timeout-minutes 120
      - name: Publish the bound selection records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-archive-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-selection/summary.json
            ${{ runner.temp }}/ui-selection/summary.md
            ${{ runner.temp }}/ui-selection/archive-selection*.json
            ${{ runner.temp }}/ui-selection/archive-refusals*.json
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error
      - name: Display selection summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ui-selection/summary.md"; then
            cat "$RUNNER_TEMP/ui-selection/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi

  ui-shards:
    name: ui-${{ matrix.device }}-${{ matrix.shard }}
    needs: [change, plan, ui-archive, strict]
    if: ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && needs.ui-archive.result == 'success' && needs.ui-archive.outputs.run_ui == 'true' }}
    runs-on: xcode-27
    timeout-minutes: 110
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.ui_matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: ui-source
          fetch-depth: 2
          persist-credentials: false
      - name: Preflight and select the pinned Xcode
        working-directory: ui-source
        run: |
          /usr/bin/python3 -B -c 'from pathlib import Path; import sys; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
      - name: Verify pins and prepare Python
        working-directory: ui-source
        run: |
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 \
            --venv "$RUNNER_TEMP/ui-python" --verify-toolchain
          echo "PYTHON=$RUNNER_TEMP/ui-python/bin/python3" >> "$GITHUB_ENV"
      - name: Read the retained archive job's selection record
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.ui-archive.outputs.selection_artifact }}
          path: ${{ runner.temp }}/ui-selection
      - name: Download by verified immutable archive ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ matrix.device == 'appletv' && needs.ui-archive.outputs.tvos_artifact_id || needs.ui-archive.outputs.ios_artifact_id }}
          path: ${{ runner.temp }}/ui-archive
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ matrix.device == 'appletv' && needs.ui-archive.outputs.tvos_producer_run_id || needs.ui-archive.outputs.ios_producer_run_id }}
      - name: Create only this shard's pinned simulator
        working-directory: ui-source
        run: |
          "$PYTHON" -B scripts/ci_ui_tests.py simulator --device '${{ matrix.device }}' --shard '${{ matrix.shard }}'
          if test '${{ matrix.device }}' = appletv; then
            echo 'UI_PLATFORM=tvos' >> "$GITHUB_ENV"
          else
            echo 'UI_PLATFORM=ios' >> "$GITHUB_ENV"
          fi
      - name: Run the UI target from relocated Products
        working-directory: ui-source
        run: |
          "$PYTHON" -B scripts/ci_ui_tests.py run --device '${{ matrix.device }}' --shard '${{ matrix.shard }}' \
            --destination "$UI_DESTINATION" --archive-dir "$RUNNER_TEMP/ui-archive" \
            --selection-path "$RUNNER_TEMP/ui-selection/archive-selection-$UI_PLATFORM.json" \
            --relocated-path "$RUNNER_TEMP/ui-relocated" --output-dir "$RUNNER_TEMP/ui-records" \
            --timeout-minutes 65 --total-timeout-minutes 85 --result-export-timeout-seconds 180 --wait-factor 2 --min-free-gib 30
      - name: Recheck the sensitive scan before publishing
        id: scan
        if: always()
        working-directory: ui-source
        run: |
          "$PYTHON" -B scripts/ci_ui_tests.py check-upload --output-dir "$RUNNER_TEMP/ui-records"
      - name: Publish only scanned fixture records
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-${{ matrix.device }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui-records/summary.json
            ${{ runner.temp }}/ui-records/summary.md
            ${{ runner.temp }}/ui-records/fixture-coverage.json
            ${{ runner.temp }}/ui-records/fixture-coverage.md
            ${{ runner.temp }}/ui-records/coverage-verdict.json
            ${{ runner.temp }}/ui-records/compiled-tests.json
            ${{ runner.temp }}/ui-records/compiled-tests-attempt-1.json
            ${{ runner.temp }}/ui-records/enumeration-retry.json
            ${{ runner.temp }}/ui-records/official-*.json
            ${{ runner.temp }}/ui-records/retry-invocations.json
            ${{ runner.temp }}/ui-records/shard-timing.json
            ${{ runner.temp }}/ui-records/wait-configuration.json
            ${{ runner.temp }}/ui-records/export-timing*.json
            ${{ runner.temp }}/ui-records/export-read-timing.json
            ${{ runner.temp }}/ui-records/sensitive-scan.json
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error
      - name: Publish scanned public failure attachments
        if: always() && steps.scan.outcome == 'success' && steps.scan.outputs.has_screenshots == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-failures-${{ matrix.device }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ui-records/failure-screenshots
          retention-days: 7
          if-no-files-found: error
      - name: Display summary and remove task-owned products
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/ui-records/summary.md"; then
            cat "$RUNNER_TEMP/ui-records/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -n "${UI_SIMULATOR:-}"; then
            xcrun simctl shutdown "$UI_SIMULATOR" || true
            xcrun simctl delete "$UI_SIMULATOR"
          fi
          rm -rf "$RUNNER_TEMP/ui-relocated" "$RUNNER_TEMP/ui-archive"


  ui-aggregate:
    if: ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && github.event_name != 'pull_request' && !inputs.live_only && !inputs.strict_only && !inputs.shard && !inputs.probe_environment_refusal }}
    needs: [change, plan, ui-archive, ui-shards]
    name: nightly-ui-aggregate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject private configuration and set up pinned reader packages
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
          /usr/bin/python3 -B scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/nightly-python"
      - name: Download this attempt's full UI plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nightly-ui-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-plan
      - name: Download this attempt's iPhone UI records
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ui-iphone-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-records
      - name: Download this attempt's iPad UI records
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ui-ipad-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-records
      - name: Download this attempt's Apple TV UI records
        if: always()
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ui-appletv-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-records
      - name: Judge every shard and require the complete default-plan union
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          UI_MATRIX_JOB_RESULT: ${{ needs.ui-shards.result }}
        run: |
          "$RUNNER_TEMP/nightly-python/bin/python3" -B scripts/ci_nightly_ui.py aggregate \
            --plan "$RUNNER_TEMP/nightly-ui-plan/plan.json" --records-dir "$RUNNER_TEMP/nightly-ui-records" \
            --output-dir "$RUNNER_TEMP/nightly-ui-aggregate" --matrix-job-result "$UI_MATRIX_JOB_RESULT"
      - name: Publish the failed or passing UI aggregate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-ui-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nightly-ui-aggregate
          retention-days: 7
          if-no-files-found: error
      - name: Display UI coverage and capacity
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nightly-ui-aggregate/nightly-ui.md"; then
            cat "$RUNNER_TEMP/nightly-ui-aggregate/nightly-ui.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          rm -rf "$RUNNER_TEMP/nightly-ui-plan" "$RUNNER_TEMP/nightly-ui-records" "$RUNNER_TEMP/nightly-ui-aggregate"

  live-admission:
    if: ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && !inputs.strict_only && !inputs.ui_only && !inputs.shard && !inputs.probe_environment_refusal }}
    needs: change
    runs-on: xcode-27
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      admitted: ${{ steps.admission.outputs.admitted }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check event, actor, ref, workflow, checkout and main ancestry without credentials
        id: admission
        run: /usr/bin/python3 -B scripts/ci_live_tests.py admit

  live-canary:
    needs: [live-admission, live-build]
    if: github.event_name == 'pull_request' || needs.live-admission.outputs.admitted == 'true'
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: live-consumer
          persist-credentials: false
      - name: Select pinned Xcode and Python without credentials
        working-directory: live-consumer
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 --venv "$RUNNER_TEMP/live-python" --verify-toolchain
      - name: Choose the latest unexpired iOS producer attempt
        id: archive
        working-directory: live-consumer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --slurp > "$RUNNER_TEMP/live-artifacts.json"
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_live_tests.py choose-artifact \
            --platform ios --metadata "$RUNNER_TEMP/live-artifacts.json"
      - name: Validate archive provenance and stage the real live runner
        working-directory: live-consumer
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
          LIVE_PRODUCER_ATTEMPT: ${{ steps.archive.outputs.producer_attempt }}
        run: |
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_build_archive.py select --platform ios \
            --artifact-id "$LIVE_ARTIFACT_ID" --producer-attempt "$LIVE_PRODUCER_ATTEMPT" \
            --selection-path "$RUNNER_TEMP/live-selection.json" --output-dir "$RUNNER_TEMP/live-selection-records"
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_unit_tests.py stage \
            --path "$RUNNER_TEMP/live-tools" --selection-path "$RUNNER_TEMP/live-selection.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.archive.outputs.artifact_id }}
          path: ${{ runner.temp }}/live-download
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Remove source before fake test-time configuration
        run: rm -rf live-consumer
      - name: Register and inject fake canary configuration
        run: '"$RUNNER_TEMP/live-python/bin/python3" -B "$RUNNER_TEMP/live-tools/scripts/ci_live_tests.py" prepare-canary'
      - name: Exercise the real live suites and private failure pipeline
        id: live
        run: |
          "$RUNNER_TEMP/live-python/bin/python3" -B "$RUNNER_TEMP/live-tools/scripts/ci_live_tests.py" run --canary \
            --selection-path "$RUNNER_TEMP/live-selection.json" --archive-dir "$RUNNER_TEMP/live-download" \
            --relocated-path "$RUNNER_TEMP/live-relocated" --output-dir "$RUNNER_TEMP/live-summary" \
            --private-dir "$RUNNER_TEMP/live-private" --min-free-gib 30
      - name: Publish the normal scanned summaries and canary verdict
        if: always() && steps.live.outputs.records_safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-canary-ios-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/live-summary
          retention-days: 7
          if-no-files-found: error
      - name: Display the normal scanned step summary
        if: always() && steps.live.outputs.records_safe == 'true'
        run: cat "$RUNNER_TEMP/live-summary/live-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispose task-owned canary material
        if: always()
        run: rm -rf "$RUNNER_TEMP/live-private" "$RUNNER_TEMP/live-relocated" "$RUNNER_TEMP/live-download" "$RUNNER_TEMP/live-tools"

  live-environment-refusal:
    if: github.event_name == 'workflow_dispatch' && inputs.probe_environment_refusal && github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: immich-test-server
    steps:
      - run: /usr/bin/false

  live-build:
    if: >-
      ${{ !cancelled() && needs.change.outputs.run_nightly != 'false' && (github.event_name == 'pull_request' || needs.live-admission.outputs.admitted == 'true' ||
      (github.event_name != 'pull_request' && !inputs.live_only && !inputs.strict_only && !inputs.shard && !inputs.probe_environment_refusal)) }}
    needs: [change, live-admission]
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: ${{ fromJSON(github.event_name == 'pull_request' && '["ios"]' || '["ios", "tvos"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: live-producer
          fetch-depth: 0
          persist-credentials: false
      - name: Repeat admission and reject private configuration before setup
        working-directory: live-producer
        env:
          LIVE_ADMITTED: ${{ needs.live-admission.outputs.admitted }}
        run: |
          if test "$GITHUB_EVENT_NAME" != pull_request && test "$LIVE_ADMITTED" = true; then
            /usr/bin/python3 -B scripts/ci_live_tests.py admit
          fi
          /usr/bin/python3 -B -c 'from pathlib import Path; import sys; sys.path.insert(0,"scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
      - name: Select pinned Xcode and Python
        working-directory: live-producer
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 --venv "$RUNNER_TEMP/live-python" --verify-toolchain
      - name: Build one secret-free archive per platform
        id: build
        working-directory: live-producer
        env:
          LIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_build_archive.py build --platform "$LIVE_PLATFORM" \
            --derived-data-path "$RUNNER_TEMP/live-derived" --output-dir "$RUNNER_TEMP/live-build" --min-free-gib 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.build.outputs.artifact_name }}
          path: ${{ runner.temp }}/live-build/archive
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
      - name: Remove producer products
        if: always()
        run: rm -rf "$RUNNER_TEMP/live-derived" "$RUNNER_TEMP/live-build"

  live-unit:
    if: needs.live-admission.outputs.admitted == 'true'
    needs: [live-admission, live-build]
    runs-on: xcode-27
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    environment: immich-test-server
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: live-consumer
          fetch-depth: 0
          persist-credentials: false
      - name: Repeat credential-free admission
        working-directory: live-consumer
        run: /usr/bin/python3 -B scripts/ci_live_tests.py admit
      - name: Select pinned Xcode and Python
        working-directory: live-consumer
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 --venv "$RUNNER_TEMP/live-python" --verify-toolchain
      - name: Select immutable artifact ID and stage declarations from the tested tree
        id: archive
        working-directory: live-consumer
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --slurp > "$RUNNER_TEMP/live-artifacts.json"
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_live_tests.py choose-artifact \
            --platform "$LIVE_PLATFORM" --metadata "$RUNNER_TEMP/live-artifacts.json"
      - name: Validate the chosen producer attempt and stage declarations
        working-directory: live-consumer
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE_PLATFORM: ${{ matrix.platform }}
          LIVE_ARTIFACT_ID: ${{ steps.archive.outputs.artifact_id }}
          LIVE_PRODUCER_ATTEMPT: ${{ steps.archive.outputs.producer_attempt }}
        run: |
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_build_archive.py select --platform "$LIVE_PLATFORM" \
            --artifact-id "$LIVE_ARTIFACT_ID" --producer-attempt "$LIVE_PRODUCER_ATTEMPT" \
            --selection-path "$RUNNER_TEMP/live-selection.json" --output-dir "$RUNNER_TEMP/live-selection-records"
          "$RUNNER_TEMP/live-python/bin/python3" -B scripts/ci_unit_tests.py stage \
            --path "$RUNNER_TEMP/live-tools" --selection-path "$RUNNER_TEMP/live-selection.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ steps.archive.outputs.artifact_id }}
          path: ${{ runner.temp }}/live-download
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}
      - name: Remove source checkout before test-time injection
        run: rm -rf live-consumer
      - name: Execute only live suites with private capture
        id: live
        env:
          CI_LIVE_URL: ${{ secrets.IMMICH_TEST_SERVER_URL }}
          CI_LIVE_KEY: ${{ secrets.IMMICH_TEST_SERVER_API_KEY }}
        run: |
          "$RUNNER_TEMP/live-python/bin/python3" -B "$RUNNER_TEMP/live-tools/scripts/ci_live_tests.py" run \
            --selection-path "$RUNNER_TEMP/live-selection.json" --archive-dir "$RUNNER_TEMP/live-download" \
            --relocated-path "$RUNNER_TEMP/live-relocated" --output-dir "$RUNNER_TEMP/live-summary" \
            --private-dir "$RUNNER_TEMP/live-private" --min-free-gib 30
      - name: Publish only scanned allowlisted live summary
        if: always() && steps.live.outputs.records_safe == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-unit-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/live-summary/live-summary.json
            ${{ runner.temp }}/live-summary/live-summary.md
            ${{ runner.temp }}/live-summary/live-provenance.json
          retention-days: 7
          if-no-files-found: error
      - name: Display only scanned summary
        if: always() && steps.live.outputs.records_safe == 'true'
        run: cat "$RUNNER_TEMP/live-summary/live-summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Dispose task-owned live material
        if: always()
        run: rm -rf "$RUNNER_TEMP/live-private" "$RUNNER_TEMP/live-relocated" "$RUNNER_TEMP/live-download" "$RUNNER_TEMP/live-tools"
