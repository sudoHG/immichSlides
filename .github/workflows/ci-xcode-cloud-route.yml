name: ci-xcode-cloud-route

on:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Authoritative same-repository pull-request ci-ui run
        required: true
        type: string
      mode:
        description: Routing policy or bounded fallback diagnostic
        required: true
        default: auto
        type: choice
        options: [auto, github, force-start-failure]

permissions: {}

concurrency:
  group: ci-xcc-account-budget
  cancel-in-progress: false

jobs:
  route:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: xcode-cloud
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - run: /usr/bin/python3 scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/ci-python"
      - name: Decide under congestion and the account compute cap
        id: route
        env:
          CI_WORKFLOW_TOKEN: ${{ github.token }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: '"$RUNNER_TEMP/ci-python/bin/python3" -B scripts/ci_xcode_cloud_route.py'
      - if: success() && steps.route.outputs.recorded == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-xcc-route-${{ steps.route.outputs.producer_run_id }}-${{ steps.route.outputs.producer_attempt }}
          path: ${{ runner.temp }}/ci-xcc-route/route.json
          if-no-files-found: error
          retention-days: 30
