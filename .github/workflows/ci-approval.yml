name: ci-approval
run-name: CI approval PR ${{ inputs.pull_request }} ${{ inputs.head_sha }}

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR requesting exact-head approval
        type: string
        required: true
      head_sha:
        description: Exact head SHA to approve
        type: string
        required: true

permissions: {}

jobs:
  wait:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: ci-approval
    steps:
      - run: /usr/bin/true

  record:
    needs: wait
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    environment: ci-publisher
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - run: /usr/bin/python3 scripts/setup_ci_publisher_python.py --venv "$RUNNER_TEMP/ci-python"
      - env:
          CI_WORKFLOW_TOKEN: ${{ github.token }}
          CI_APP_ID: ${{ vars.CI_APP_ID }}
          CI_APP_PRIVATE_KEY: ${{ secrets.CI_APP_PRIVATE_KEY }}
        run: '"$RUNNER_TEMP/ci-python/bin/python3" -B scripts/ci_publish.py approve'
