name: Privacy Preflight Trusted

on:
  pull_request_target:
    types: [opened, synchronize, edited, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  privacy-preflight-trusted:
    name: privacy-preflight-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - name: Fetch exact PR head as Git objects only
        env:
          PRIVACY_PR_NUMBER: ${{ github.event.pull_request.number }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PRIVACY_PR_NUMBER" in
            *[!0-9]*|"") exit 3 ;;
          esac
          case "$PRIVACY_HEAD_SHA" in
            *[!0-9a-f]*|"") exit 3 ;;
          esac
          git fetch --no-tags --force origin \
            "refs/pull/${PRIVACY_PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "$PRIVACY_HEAD_SHA"

      - name: Verify and scan with trusted base implementation
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/run_trusted_privacy_preflight.sh
