name: ci-strict-tracer

on:
  pull_request:
    paths:
      - .github/workflows/ci-strict-tracer.yml
      - scripts/run_strict*.py
      - scripts/strict_e2e_*.py
      - scripts/test_run_strict_e2e.py
      - scripts/strict-tracer.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-strict-tracer-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tracer:
    name: strict-tracer-${{ matrix.platform }}
    runs-on: xcode-27
    timeout-minutes: 100
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform: [ios, tvos]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Reject private configuration before setup
        run: |
          /usr/bin/python3 -B -c 'import sys; from pathlib import Path; sys.path.insert(0, "scripts"); from ci_build_archive import workspace_preflight; workspace_preflight(Path.cwd())'
      - name: Select and verify pinned toolchain
        run: |
          /usr/bin/python3 -c 'import json; print("DEVELOPER_DIR=" + json.load(open("scripts/ci-pins.json"))["xcode"]["developer_dir"])' >> "$GITHUB_ENV"
          /usr/bin/python3 -B scripts/setup_ci_python.py --python /usr/bin/python3 \
            --venv "$RUNNER_TEMP/strict-python" --verify-toolchain
      - name: Create a dedicated simulator
        run: |
          platform='${{ matrix.platform }}'
          device=$(/usr/bin/python3 -c 'import json,sys; p=json.load(open("scripts/ci-pins.json")); print(p["device_types"]["iphone" if sys.argv[1]=="ios" else "appletv"])' "$platform")
          runtime=$(/usr/bin/python3 -c 'import json,sys; print(json.load(open("scripts/ci-pins.json"))["simulators"][sys.argv[1]]["runtime"])' "$platform")
          udid=$(xcrun simctl create immichSlides-strict-tracer "$device" "$runtime")
          echo "STRICT_SIMULATOR=$udid" >> "$GITHUB_ENV"
          os_name=$([ "$platform" = ios ] && echo iOS || echo tvOS)
          echo "STRICT_DESTINATION=platform=$os_name Simulator,id=$udid" >> "$GITHUB_ENV"
      - name: Measure cold build and run warm cases
        run: |
          "$RUNNER_TEMP/strict-python/bin/python3" -B scripts/run_strict_ci_tracer.py \
            --platform '${{ matrix.platform }}' --destination "$STRICT_DESTINATION" \
            --output-dir "$RUNNER_TEMP/strict-tracer" --min-free-gib 30 \
            --cold-timeout-seconds 1200 --warm-timeout-seconds 600
      - name: Publish only compact records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-tracer-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/strict-tracer/records
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error
      - name: Publish scanned P2 recording timing evidence
        if: success() && matrix.platform == 'ios'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strict-p2-trace-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-tracer/p2-trace
          retention-days: 7
          if-no-files-found: error
      - name: Display records and clean task outputs
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/strict-tracer/records/summary.md"; then
            cat "$RUNNER_TEMP/strict-tracer/records/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if test -f "$RUNNER_TEMP/strict-tracer/runner-group-cleanup-failed"; then
            echo 'Runner descendants could not be stopped; retaining their inputs until runner teardown.' >&2
            exit 1
          fi
          if test -n "$STRICT_SIMULATOR"; then
            xcrun simctl shutdown "$STRICT_SIMULATOR" || true
            xcrun simctl delete "$STRICT_SIMULATOR"
          fi
          rm -rf "$RUNNER_TEMP/strict-tracer"
