name: CI toolchain

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci-pins.json'
      - 'scripts/setup_ci_python.py'
      - 'scripts/check_workflow_policy.py'
      - 'scripts/test_check_workflow_policy.py'
      - 'docs/CI_TOOLCHAIN.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify pins and create isolated Python environment
        run: |
          df -h /System/Volumes/Data
          python3 --version
          zstd --version
          python3 scripts/setup_ci_python.py --venv "$RUNNER_TEMP/ci-python" --verify-toolchain

      - name: Verify the environment read-only and check workflow policy
        run: |
          "$RUNNER_TEMP/ci-python/bin/python3" -B scripts/setup_ci_python.py --venv "$RUNNER_TEMP/ci-python" --check
          "$RUNNER_TEMP/ci-python/bin/python3" -B scripts/check_workflow_policy.py
          "$RUNNER_TEMP/ci-python/bin/python3" -B -m unittest discover -s scripts -p test_check_workflow_policy.py
