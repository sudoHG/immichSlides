name: CI toolchain

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/ci-pins.json'
      - 'scripts/setup_ci_python.py'
      - 'scripts/check_workflow_policy.py'
      - 'scripts/test_check_workflow_policy.py'
      - 'docs/CI_TOOLCHAIN.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_TOOLCHAIN_TIER: pr

jobs:
  toolchain:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Select Xcode and inspect its Python
        run: |
          /usr/bin/python3 --version
          python3 -c 'import sys; sys.path.insert(0, "scripts"); from setup_ci_python import load_pins; print("DEVELOPER_DIR=" + load_pins()["xcode"]["developer_dir"])' >> "$GITHUB_ENV"

      - name: Verify pins and create isolated Python environment
        run: |
          df -h /System/Volumes/Data
          /usr/bin/python3 --version
          zstd --version
          /usr/bin/python3 scripts/setup_ci_python.py --python /usr/bin/python3 --venv "$RUNNER_TEMP/ci-python" --verify-toolchain

      - name: Verify the environment read-only and check workflow policy
        run: |
          "$RUNNER_TEMP/ci-python/bin/python3" -B scripts/setup_ci_python.py --venv "$RUNNER_TEMP/ci-python" --check
          "$RUNNER_TEMP/ci-python/bin/python3" -B scripts/check_workflow_policy.py
          "$RUNNER_TEMP/ci-python/bin/python3" -B -m unittest discover -s scripts -p test_check_workflow_policy.py

      - name: Run existing host checks in the pinned environment
        run: |
          export PATH="$RUNNER_TEMP/ci-python/bin:$PATH"
          scripts/check_all.sh
