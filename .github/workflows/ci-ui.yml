        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          "$PYTHON" -B scripts/ci_ui_tests.py wait-group --group ios \
            --output-dir "$RUNNER_TEMP/ui-cloud-selection" \
            --selection-path "$RUNNER_TEMP/ui-selection/ui-selection.json" --timeout-minutes 180 --defer-main-ui
