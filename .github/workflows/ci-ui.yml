        with:
          name: ${{ needs.tvos-wait.outputs.selection_artifact }}
          path: ${{ runner.temp }}/ui-selection
      - name: Download by verified immutable archive ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.tvos-wait.outputs.artifact_id }}
          path: ${{ runner.temp }}/ui-archive
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.tvos-wait.outputs.producer_run_id }}
      - name: Create only this shard's pinned simulator
