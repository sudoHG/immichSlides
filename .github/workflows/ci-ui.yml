  ios-wait:
    name: ui-cloud-wait-ios
    needs: selection
    if: ${{ !cancelled() && needs.selection.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 185
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: read
    outputs:
