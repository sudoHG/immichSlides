        with:
          name: ui-group-${{ github.run_id }}-${{ github.run_attempt }}-tvos
          path: |
            ${{ runner.temp }}/ui-cloud-selection/summary.json
            ${{ runner.temp }}/ui-cloud-selection/summary.md
            ${{ runner.temp }}/ui-cloud-selection/archive-selection*.json
            ${{ runner.temp }}/ui-cloud-selection/archive-refusals*.json
            ${{ runner.temp }}/ui-cloud-selection/group-selection.json
          retention-days: ${{ github.event_name == 'pull_request' && 30 || 7 }}
          if-no-files-found: error

  appletv-shards:
